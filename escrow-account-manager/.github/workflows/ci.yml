name: CI/CD Automated Testing & Docker Build Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Automated Integration & Unit Tests ──────────────────────────────
  test:
    name: Automated Integration & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: escrow_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: escrow_test
      DB_USER: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET: ci-test-secret-key-not-for-production
      JWT_EXPIRE: 1h

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          if [ -d "backend" ]; then cd backend; fi
          npm ci

      - name: Run Backend Integration Test Suite
        run: |
          if [ -d "backend" ]; then cd backend; fi
          npm test

      - name: Install & Build Frontend Assets
        run: |
          if [ -d "frontend" ]; then cd frontend; fi
          npm ci
          npx vite build

  # ── Job 2: Automated Docker Build Verification ─────────────────────────────
  docker:
    name: Build & Verify Docker Containers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ (stat('backend') && 'backend') || '.' }}
          file: ${{ (stat('backend') && 'backend/Dockerfile') || 'Dockerfile' }}
          push: false
          tags: escrowtrust-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ (stat('frontend') && 'frontend') || '.' }}
          file: ${{ (stat('frontend') && 'frontend/Dockerfile') || 'Dockerfile' }}
          push: false
          tags: escrowtrust-frontend:latest
