name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run backend tests ──────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: escrow_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: escrow_test
      DB_USER: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET: ci-test-secret-key-not-for-production
      JWT_EXPIRE: 1h

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: escrow-account-manager/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: escrow-account-manager/backend

      - name: Run tests
        run: npm test
        working-directory: escrow-account-manager/backend

  # ── Job 2: Build and push Docker images (main branch only) ───────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./escrow-account-manager/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/escrowtrust-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./escrow-account-manager/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/escrowtrust-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
