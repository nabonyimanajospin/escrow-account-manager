name: CI/CD Automated Testing & Docker Build Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  # ── Job 1: Automated Integration & Unit Tests ──────────────────────────────
  test:
    name: Automated Integration & Unit Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-key-not-for-production
      JWT_EXPIRE: 1h

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies & Run Integration Tests
        run: |
          cd escrow-account-manager/backend
          npm ci
          npm test

      - name: Install Frontend Dependencies & Build Production Assets
        run: |
          cd escrow-account-manager/frontend
          npm ci
          npx vite build

  # ── Job 2: Automated Docker Container Verification ────────────────────────
  docker:
    name: Build & Verify Docker Containers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./escrow-account-manager/backend
          file: ./escrow-account-manager/backend/Dockerfile
          push: false
          tags: escrowtrust-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./escrow-account-manager/frontend
          file: ./escrow-account-manager/frontend/Dockerfile
          push: false
          tags: escrowtrust-frontend:latest
